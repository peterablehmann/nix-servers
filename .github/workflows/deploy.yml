name: deploy

on:
  push:
    branches:
      - "main"

permissions: read-all

jobs:
  Check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v7
      - name: Setup Lix
        uses: samueldr/lix-gha-installer-action@v2026-02-22
      # - name: "Run flake checks"
      #   run: nix flake check --all-systems

  Lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v7
      - name: Setup Lix
        uses: samueldr/lix-gha-installer-action@v2026-02-22
      - name: Check format
        run: nix develop --command bash -c 'treefmt --ci'
      - name: Lint using Statix
        run: nix run nixpkgs#statix -- check .
  
  Deploy:
    needs: [ Check, Lint ]
    runs-on: ubuntu-latest
    steps:
      - name: Setup netbird
        run: |
          curl -fsSL https://pkgs.netbird.io/install.sh | sh
          netbird up --setup-key ${{ secrets.NB_SETUP_KEY }}
      - name: Initialize SSH-Key
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_KEY }}
      - name: Check out repository code
        uses: actions/checkout@v7
      - name: Setup Lix
        uses: samueldr/lix-gha-installer-action@v2026-02-22
      - name: Build config
        run: nix develop --command bash -c 'colmena apply push'
      - name: Build DNS config
        run: nix build .#dns
      - name: Deploy DNS config
        run: nix develop --command bash -c 'octodns-sync --config-file result --doit'
        env:
          HETZNER_DNS_API: ${{ secrets.HETZNER_DNS_API }}
      - name: Activate config
        run: nix develop --command bash -c 'colmena apply --on @ci'
